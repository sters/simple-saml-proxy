version: '3.8'

services:
  # Simple SAML Proxy
  simple-saml-proxy:
    build:
      context: ..
      dockerfile: example/Dockerfile
    container_name: simple-saml-proxy
    ports:
      - "8080:8080"
    environment:
      - SERVER_LISTEN_ADDRESS=:8080
      - PROXY_ENTITY_ID=http://simple-saml-proxy:8080
      - PROXY_SSO_URL=http://simple-saml-proxy:8080/sso
      - PROXY_ACS_URL=http://simple-saml-proxy:8080/acs
      - PROXY_METADATA_URL=http://simple-saml-proxy:8080/metadata
      - PROXY_PRIVATE_KEY_PATH=/certs/proxy.key
      - PROXY_CERTIFICATE_PATH=/certs/proxy.crt
      # IdP configuration
      - IDP_0_ID=test-idp
      - IDP_0_NAME=Test Identity Provider
      - IDP_0_SSO_URL=http://test-idp:8080/simplesaml/saml2/idp/SSOService.php
      - IDP_0_METADATA_URL=http://test-idp:8080/simplesaml/saml2/idp/metadata.php
      # Allowed SP configuration
      - PROXY_ALLOWED_SP_0_ENTITY_ID=http://test-sp/shibboleth
      - PROXY_ALLOWED_SP_0_NAME=Test Service Provider
      - PROXY_ALLOWED_SP_0_ACS_URL=http://test-sp/Shibboleth.sso/SAML2/POST
      # Metadata retry configuration
      - METADATA_MAX_RETRIES=10
      - METADATA_INITIAL_DELAY=2s
      - METADATA_MAX_DELAY=30s
    volumes:
      - ./docker/certs:/certs:ro
    networks:
      - saml-network

  # Test Identity Provider (kristophjunge/test-saml-idp)
  test-idp:
    image: kristophjunge/test-saml-idp:latest
    container_name: test-idp
    ports:
      - "8000:8080"
    environment:
      - SIMPLESAMLPHP_SP_ENTITY_ID=http://simple-saml-proxy:8080
      - SIMPLESAMLPHP_SP_ASSERTION_CONSUMER_SERVICE=http://simple-saml-proxy:8080/acs
    networks:
      - saml-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/simplesaml/saml2/idp/metadata.php"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  # Test Service Provider (szabogyula/saml-sp)
  test-sp:
    image: szabogyula/saml-sp:latest
    container_name: test-sp
    ports:
      - "8001:80"
    environment:
      - VIRTUAL_HOST=test-sp
      - ENTITY_ID=http://test-sp/shibboleth
      - IDP_ENTITY_ID=http://simple-saml-proxy:8080
      - SUPPORT_CONTACT=test@example.com
      - ALIAS_SECURE=/secure
      - XML_METADATA_PROVIDER=http://simple-saml-proxy:8080/metadata
      - NOSSL=true
    networks:
      - saml-network

networks:
  saml-network:
    driver: bridge
