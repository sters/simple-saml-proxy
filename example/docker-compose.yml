version: '3.8'

# YAML anchors for reusable configurations
x-keycloak-common: &keycloak-common
  image: quay.io/keycloak/keycloak:23.0
  environment: &keycloak-env
    KEYCLOAK_ADMIN: admin
    KEYCLOAK_ADMIN_PASSWORD: admin
    KC_DB: dev-file
    KC_HOSTNAME_STRICT: false
    KC_HOSTNAME_STRICT_HTTPS: false
    KC_HTTP_ENABLED: true
    KC_HOSTNAME_STRICT_BACKCHANNEL: false
    KC_SPI_CONNECTIONS_HTTP_CLIENT_DEFAULT_DISABLE_TRUST_MANAGER: true
    KC_SPI_TRUSTSTORE_FILE_FILE: ""
    KC_SPI_TRUSTSTORE_FILE_PASSWORD: ""
  command: &keycloak-command
    - start-dev
    - --import-realm
    - --hostname-strict=false
    - --hostname-strict-https=false
  networks:
    - saml-network
  healthcheck: &keycloak-healthcheck
    test: ["CMD", "/opt/keycloak/bin/kc.sh", "show-config", "--all"]
    interval: 5s
    timeout: 3s
    retries: 3
    start_period: 10s

services:
  # Keycloak as Identity Provider
  keycloak-idp:
    <<: *keycloak-common
    container_name: keycloak-idp
    environment:
      <<: *keycloak-env
      KC_HOSTNAME_URL: "http://localhost:11001"
    ports:
      - "11001:8080"
    volumes:
      - ./keycloak-idp:/opt/keycloak/data/import

  # Keycloak as second Identity Provider
  keycloak-idp2:
    <<: *keycloak-common
    container_name: keycloak-idp2
    environment:
      <<: *keycloak-env
      KC_HOSTNAME_URL: "http://localhost:11002"
      KC_HTTP_PORT: 8080
    ports:
      - "11002:8080"
    volumes:
      - ./keycloak-idp2:/opt/keycloak/data/import
    command:
      - start-dev
      - --import-realm
      - --hostname-strict=false
      - --hostname-strict-https=false
      - --http-port=8080

  # Keycloak as Service Provider  
  keycloak-sp:
    <<: *keycloak-common
    container_name: keycloak-sp
    environment:
      <<: *keycloak-env
      KC_HOSTNAME_URL: "http://localhost:12000"
      KC_HTTP_PORT: 8080
      KC_LOG_LEVEL: DEBUG
      QUARKUS_LOG_CATEGORY__ORG_KEYCLOAK_BROKER__LEVEL: TRACE
      QUARKUS_LOG_CATEGORY__ORG_KEYCLOAK_SAML__LEVEL: TRACE
      QUARKUS_LOG_CATEGORY__ORG_KEYCLOAK_PROTOCOL_SAML__LEVEL: TRACE
      QUARKUS_LOG_CATEGORY__ORG_KEYCLOAK_SERVICES__LEVEL: DEBUG
    ports:
      - "12000:8080"
    volumes:
      - ./keycloak-sp:/opt/keycloak/data/import
    command:
      - start-dev
      - --import-realm
      - --hostname-strict=false
      - --hostname-strict-https=false
      - --http-port=8080

  # Simple SAML Proxy
  simple-saml-proxy:
    build:
      context: ..
      dockerfile: example/Dockerfile
    container_name: simple-saml-proxy
    environment:
      # Proxy configuration
      PROXY_ENTITY_ID: "http://localhost:10000"
      PROXY_PRIVATE_KEY_PATH: "/certs/proxy.key"
      PROXY_CERTIFICATE_PATH: "/certs/proxy.crt"
      
      # Identity Provider configuration (Keycloak IdP)
      IDP_0_ID: "keycloak-idp"
      IDP_0_NAME: "Development IdP"
      IDP_0_METADATA_URL: "http://keycloak-idp:8080/realms/test/protocol/saml/descriptor"
      IDP_0_SSO_URL: "http://keycloak-idp:8080/realms/test/protocol/saml"
      
      # Second Identity Provider configuration (Keycloak IdP2)
      IDP_1_ID: "keycloak-idp2"
      IDP_1_NAME: "Enterprise IdP"
      IDP_1_METADATA_URL: "http://keycloak-idp2:8080/realms/test2/protocol/saml/descriptor"
      IDP_1_SSO_URL: "http://keycloak-idp2:8080/realms/test2/protocol/saml"
      
      # Allowed Service Providers (Keycloak SP)
      PROXY_ALLOWED_SP_0_ENTITY_ID: "http://localhost:12000/realms/sp-realm"
      PROXY_ALLOWED_SP_0_ACS_URL: "http://localhost:12000/realms/sp-realm/protocol/saml"
      
      # Server configuration
      SERVER_LISTEN_ADDRESS: ":8080"
      LOG_LEVEL: "debug"
      
      # Metadata retry configuration
      METADATA_MAX_RETRIES: 10
      METADATA_INITIAL_DELAY: 2s
      METADATA_MAX_DELAY: 30s
    ports:
      - "10000:8080"
    volumes:
      - ./certs:/certs:ro
    networks:
      - saml-network
    depends_on:
      keycloak-idp:
        condition: service_healthy
      keycloak-idp2:
        condition: service_healthy
      keycloak-sp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ping"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  # Test runner for integration tests
  test-runner:
    image: node:18-alpine
    container_name: test-runner
    working_dir: /tests
    volumes:
      - ./tests:/tests
      - ./scripts:/scripts
    networks:
      - saml-network
    depends_on:
      simple-saml-proxy:
        condition: service_healthy
    profiles:
      - testing
    command: sh -c "sleep infinity"

networks:
  saml-network:
    driver: bridge

volumes:
  keycloak-idp-data:
  keycloak-sp-data:
