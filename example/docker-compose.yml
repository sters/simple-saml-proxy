version: '3.8'

services:
  # Keycloak as Identity Provider
  keycloak-idp:
    image: quay.io/keycloak/keycloak:23.0
    container_name: keycloak-idp
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: dev-file
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HTTP_ENABLED: true
      KC_HOSTNAME_STRICT_BACKCHANNEL: false
      KC_SPI_CONNECTIONS_HTTP_CLIENT_DEFAULT_DISABLE_TRUST_MANAGER: true
      KC_SPI_TRUSTSTORE_FILE_FILE: ""
      KC_SPI_TRUSTSTORE_FILE_PASSWORD: ""
      KC_HOSTNAME_URL: "http://localhost:8080"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak-idp:/opt/keycloak/data/import
    command:
      - start-dev
      - --import-realm
      - --hostname-strict=false
      - --hostname-strict-https=false
    networks:
      - saml-network
    healthcheck:
      test: ["CMD", "/opt/keycloak/bin/kc.sh", "show-config", "--all"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Keycloak as Service Provider  
  keycloak-sp:
    image: quay.io/keycloak/keycloak:23.0
    container_name: keycloak-sp
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: dev-file
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HTTP_ENABLED: true
      KC_HOSTNAME_STRICT_BACKCHANNEL: false
      KC_SPI_CONNECTIONS_HTTP_CLIENT_DEFAULT_DISABLE_TRUST_MANAGER: true
      KC_SPI_TRUSTSTORE_FILE_FILE: ""
      KC_SPI_TRUSTSTORE_FILE_PASSWORD: ""
      KC_HOSTNAME_URL: "http://localhost:8081"
      KC_HTTP_PORT: 8081
    ports:
      - "8081:8081"
    volumes:
      - ./keycloak-sp:/opt/keycloak/data/import
    command:
      - start-dev
      - --import-realm
      - --hostname-strict=false
      - --hostname-strict-https=false
      - --http-port=8081
    networks:
      - saml-network
    healthcheck:
      test: ["CMD", "/opt/keycloak/bin/kc.sh", "show-config", "--all"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Simple SAML Proxy
  simple-saml-proxy:
    build:
      context: ..
      dockerfile: example/Dockerfile
    container_name: simple-saml-proxy
    environment:
      # Proxy configuration
      PROXY_ENTITY_ID: "http://localhost:8082"
      PROXY_ACS_URL: "http://localhost:8082/acs"
      PROXY_SSO_URL: "http://localhost:8082/metadata/sso"
      PROXY_SLO_URL: "http://localhost:8082/metadata/SLO"
      PROXY_PRIVATE_KEY_PATH: "/certs/proxy.key"
      PROXY_CERTIFICATE_PATH: "/certs/proxy.crt"
      
      # Identity Provider configuration (Keycloak IdP)
      IDP_0_ID: "keycloak-idp"
      IDP_0_NAME: "Keycloak IdP"
      IDP_0_METADATA_URL: "http://keycloak-idp:8080/realms/test/protocol/saml/descriptor"
      IDP_0_SSO_URL: "http://keycloak-idp:8080/realms/test/protocol/saml"
      
      # Allowed Service Providers (Keycloak SP)
      PROXY_ALLOWED_SP_0_ENTITY_ID: "http://localhost:8081/realms/sp-realm"
      PROXY_ALLOWED_SP_0_ACS_URL: "http://localhost:8081/realms/sp-realm/broker/saml-proxy/endpoint"
      
      # Workaround: Keycloak SP broker sends proxy entity ID as issuer
      PROXY_ALLOWED_SP_1_ENTITY_ID: "http://localhost:8082"
      PROXY_ALLOWED_SP_1_ACS_URL: "http://localhost:8081/realms/sp-realm/broker/saml-proxy/endpoint"
      
      # Server configuration
      SERVER_LISTEN_ADDRESS: ":8080"
      
      # Metadata retry configuration
      METADATA_MAX_RETRIES: 10
      METADATA_INITIAL_DELAY: 2s
      METADATA_MAX_DELAY: 30s
    ports:
      - "8082:8080"
    volumes:
      - ./certs:/certs:ro
    networks:
      - saml-network
    depends_on:
      - keycloak-idp
      - keycloak-sp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/metadata"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Test runner for integration tests
  test-runner:
    image: node:18-alpine
    container_name: test-runner
    working_dir: /tests
    volumes:
      - ./tests:/tests
      - ./scripts:/scripts
    networks:
      - saml-network
    depends_on:
      simple-saml-proxy:
        condition: service_healthy
    profiles:
      - testing
    command: sh -c "sleep infinity"

networks:
  saml-network:
    driver: bridge

volumes:
  keycloak-idp-data:
  keycloak-sp-data:
